name: Bug report
description: Create a report to help us improve
labels: [ bug ]
body:
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
  - type: textarea
    attributes:
      label: To reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Select '....' with the controller
        3. Open '....'
        4. See error
  - type: textarea
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
  - type: input
    attributes:
      label: PS4 system software
      description: Optional. PS4 system software version only (for example, 11.00).
  - type: input
    attributes:
      label: GMCA version or package revision
      description: For example, version 00.82 or the package revision shown in Settings.
  - type: textarea
    attributes:
      label: Stremio add-on context
      description: Add-on name/ID and catalog or source involved. Do not include account tokens or private URLs.
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
