name: PS4 recovery validation

on:
  push:
    branches:
      - fix/ps4-video-recovery-diagnostics
  workflow_dispatch:

jobs:
  build-ps4:
    runs-on: ubuntu-latest
    container:
      image: xfangfang/pacbrew:250221
    env:
      BASE_URL: https://github.com/dragonflylee/switchfin/releases/download/pacbrew
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply borealis patches
        run: |
          git config --global --add safe.directory '*'
          git -C library/borealis apply --verbose ../../scripts/patches/borealis-fixes.patch

      - name: Update dependencies
        run: |
          for pkg in musl-1.5-3 mbedtls-2.28.10-2 sdl2-2.0.18-19 libcurl-7.80.0-5 dav1d-1.5.4-1 ffmpeg-7.1.5-3 libmpv-0.36.0-2; do
            pacman --noconfirm -U $BASE_URL/ps4-openorbis-${pkg}-any.pkg.tar.gz
          done
          git config --system --add safe.directory $GITHUB_WORKSPACE

      - name: Build PS4
        env:
          OPENORBIS: /opt/pacbrew/ps4/openorbis
        run: |
          cmake -B build -DPLATFORM_PS4=ON -DVERSION_BUILD=${{ github.run_number }}
          make -C build -j$(nproc)

      - name: Upload pkg
        uses: actions/upload-artifact@v6
        with:
          name: GMCA-PS4-recovery-${{ github.run_number }}
          path: build/*.pkg
          if-no-files-found: error

      - name: Upload oelf
        uses: actions/upload-artifact@v6
        with:
          name: ps4-recovery-oelf-${{ github.run_number }}
          path: build/GMCA.oelf
          if-no-files-found: error
