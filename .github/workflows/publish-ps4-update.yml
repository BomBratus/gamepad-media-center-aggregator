name: publish PS4 Stremio update

on:
  workflow_run:
    workflows: [ build PS4 Stremio-only ]
    types: [ completed ]
    branches: [ dev ]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: publish-ps4-stremio-update
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ROLLING_TAG: ps4-stremio-latest
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Find validated dev build artifact
        id: source
        shell: bash
        run: |
          set -euo pipefail
          run_id="$SOURCE_RUN_ID"
          head_sha="$SOURCE_SHA"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          # Publish only the current dev revision, never an obsolete build.
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/dev" --jq '.commit.sha')"
          if [ "$head_sha" != "$current_sha" ]; then
            echo "Build $run_id is superseded by $current_sha; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          artifact_name="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and (.name | startswith("GMCA-PS4-Stremio-only-")))][0].name // empty'
          )"
          if [ -z "$artifact_name" ]; then
            echo "Successful run $run_id has no PS4 update artifact."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "Using validated run $run_id artifact $artifact_name"

      - name: Download validated artifact
        if: steps.source.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh run download "${{ steps.source.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ steps.source.outputs.artifact_name }}" \
            --dir release-artifact

      - name: Verify update payload
        if: steps.source.outputs.publish == 'true'
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact

          test -s ps4-update.json
          test -s GMCA-PS4-Stremio-only.pkg
          test -s SHA256SUMS
          test -s PS4-UPDATE-SHA256SUMS

          sha256sum -c SHA256SUMS
          sha256sum -c PS4-UPDATE-SHA256SUMS

          test "$(jq -r '.schema' ps4-update.json)" = "1"
          test "$(jq -r '.channel' ps4-update.json)" = "ps4-stremio-only"
          test "$(jq -r '.title_id' ps4-update.json)" = "GMCA00000"

          version="$(jq -r '.version' ps4-update.json)"
          [[ "$version" =~ ^[0-9]{2}\.[0-9]{2}$ ]]

          manifest_sha="$(jq -r '.sha256' ps4-update.json)"
          manifest_size="$(jq -r '.size' ps4-update.json)"
          manifest_commit="$(jq -r '.commit' ps4-update.json)"
          actual_sha="$(sha256sum GMCA-PS4-Stremio-only.pkg | awk '{print $1}')"
          actual_size="$(stat -c '%s' GMCA-PS4-Stremio-only.pkg)"

          test "$manifest_sha" = "$actual_sha"
          test "$manifest_size" = "$actual_size"
          test "$manifest_commit" = "${{ steps.source.outputs.head_sha }}"

          # SHA256SUMS contains the versioned GMCA00000 package used to build
          # the stable download-only rolling payload.
          versioned_pkg="$(awk '$2 ~ /^IV0001-GMCA00000_00-/ {print $2; exit}' SHA256SUMS)"
          test -n "$versioned_pkg"
          test -s "$versioned_pkg"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "size=$actual_size" >> "$GITHUB_OUTPUT"
          echo "versioned_pkg=$versioned_pkg" >> "$GITHUB_OUTPUT"

      - name: Compare rolling version
        if: steps.source.outputs.publish == 'true'
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          new_version="${{ steps.payload.outputs.version }}"
          new_digits="${new_version/.}"
          new_number=$((10#$new_digits))

          mkdir -p current-release
          current_version=""
          if gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern ps4-update.json --dir current-release || true
            if [ -s current-release/ps4-update.json ]; then
              current_version="$(jq -r '.version // empty' current-release/ps4-update.json)"
            fi
          fi

          if [[ "$current_version" =~ ^[0-9]{2}\.[0-9]{2}$ ]]; then
            current_digits="${current_version/.}"
            current_number=$((10#$current_digits))
            if (( new_number <= current_number )); then
              echo "Rolling feed is already $current_version; candidate $new_version is not newer."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Publish rolling release
        if: steps.source.outputs.publish == 'true' && steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.payload.outputs.version }}"
          notes="Validated GMCA PS4 Stremio-only rolling update $version. Source validated dev build: ${{ steps.source.outputs.run_id }}."

          if gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Replace the payload first and the manifest last: a console can only
            # observe a new manifest after the matching PKG is already available.
            gh release upload "$ROLLING_TAG" \
              release-artifact/GMCA-PS4-Stremio-only.pkg \
              release-artifact/PS4-UPDATE-SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "$ROLLING_TAG" release-artifact/ps4-update.json \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "GMCA PS4 Stremio-only $version" \
              --notes "$notes" --prerelease
          else
            gh release create "$ROLLING_TAG" \
              release-artifact/GMCA-PS4-Stremio-only.pkg \
              release-artifact/ps4-update.json \
              release-artifact/PS4-UPDATE-SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target dev --prerelease \
              --title "GMCA PS4 Stremio-only $version" \
              --notes "$notes"
          fi

          echo "Published PS4 rolling update $version"
          echo "PKG size: ${{ steps.payload.outputs.size }}"
          echo "PKG SHA-256: ${{ steps.payload.outputs.sha256 }}"
