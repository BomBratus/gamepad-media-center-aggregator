name: build PS4 Stremio-only

on:
  push:
    branches:
      - 'release/ps4-*-stremio-only'
  pull_request:
    branches: [ dev ]
    paths:
      - CMakeLists.txt
      - app/src/main.cpp
      - app/src/utils/version.cpp
      - app/src/utils/ps4_update.cpp
      - app/src/utils/ps4_diagnostics.cpp
      - scripts/ps4/updater/**
      - scripts/ps4/libmpv/**
      - cmake/bundle_ps4_updater_pkg.cmake
      - app/include/utils/config.hpp
      - app/include/utils/ps4_diagnostics.hpp
      - app/include/utils/ps4_update.hpp
      - app/src/view/connection_switcher.cpp
      - app/src/tab/server_type_choose.cpp
      - app/src/tab/stremio_add.cpp
      - app/src/tab/setting_tab.cpp
      - app/src/api/stremio/**
      - app/include/api/stremio/**
      - app/include/api/media/types.hpp
      - app/src/view/video_source.cpp
      - app/src/view/mpv_core.cpp
      - app/include/view/mpv_core.hpp
      - app/src/activity/player_view.cpp
      - app/include/view/video_source.hpp
      - app/src/view/recyling_video.cpp
      - app/include/view/recyling_video.hpp
      - app/src/tab/home_tab.cpp
      - app/src/tab/media_series.cpp
      - resources/xml/view/episode_card.xml
      - custom/ps4-safe-sources.patch
      - custom/ps4-ui-followups.patch
      - custom/apply-ps4-search-ui.awk
      - .github/workflows/build-ps4-stremio-only.yml
      - .github/workflows/publish-ps4-update.yml
  workflow_dispatch:

jobs:
  build-ps4-stremio-only:
    runs-on: ubuntu-latest
    container:
      image: xfangfang/pacbrew:250221
    env:
      BASE_URL: https://github.com/dragonflylee/switchfin/releases/download/pacbrew
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Resolve PS4 package version
        id: ps4ver
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^+set(PS4_VERSION "\([0-9][0-9]\.[0-9][0-9]\)")$/\1/p' custom/ps4-safe-sources.patch | head -n1)"
          test -n "$version"
          [[ "$version" =~ ^[0-9]{2}\.[0-9]{2}$ ]]
          digits="${version/.}"
          suffix="${digits}00"
          pkg="IV0001-GMCA00000_00-GMCA000000${suffix}.pkg"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "PS4 package version: $version"
          echo "Expected PKG: $pkg"

      - name: Apply PS4 recovery and safe-source UI
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory '*'
          printf '\n' >> custom/ps4-safe-sources.patch
          printf '\n' >> custom/ps4-ui-followups.patch
          git apply --check custom/ps4-safe-sources.patch
          git apply --verbose custom/ps4-safe-sources.patch
          git apply --check --recount custom/ps4-ui-followups.patch
          git apply --verbose --recount custom/ps4-ui-followups.patch
          awk -f custom/apply-ps4-search-ui.awk app/src/tab/search_tab.cpp > /tmp/search_tab.cpp
          mv /tmp/search_tab.cpp app/src/tab/search_tab.cpp
          grep -q "set(PS4_VERSION \"${{ steps.ps4ver.outputs.version }}\")" CMakeLists.txt
          grep -Fq 'GMCA_PS4_VERSION=${PS4_VERSION}' CMakeLists.txt
          git checkout -- custom/ps4-safe-sources.patch custom/ps4-ui-followups.patch
          git diff --check

      - name: Apply borealis patches
        run: |
          git -C library/borealis apply --verbose ../../scripts/patches/borealis-fixes.patch

      - name: Update dependencies
        run: |
          for pkg in musl-1.5-3 mbedtls-2.28.10-2 sdl2-2.0.18-19 libcurl-7.80.0-5 dav1d-1.5.4-1 ffmpeg-7.1.5-3 libmpv-0.36.0-2; do
            pacman --noconfirm -U $BASE_URL/ps4-openorbis-${pkg}-any.pkg.tar.gz
          done
          git config --system --add safe.directory $GITHUB_WORKSPACE

      - name: Set up Python for local libmpv build
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build GMCA patched PS4 libmpv
        shell: bash
        env:
          OPENORBIS: /opt/pacbrew/ps4/openorbis
        run: |
          set -euxo pipefail

          # Python is provided by actions/setup-python only for mpv's pinned waf build.

          work=/tmp/gmca-ps4-libmpv
          rm -rf "$work"
          mkdir -p "$work"
          cp scripts/ps4/libmpv/mpv.patch "$work/"
          cp scripts/ps4/libmpv/gmca-bitmap-subs.patch "$work/"

          python3 - <<'PY'
          import hashlib
          import pathlib
          import urllib.request

          url = "https://github.com/mpv-player/mpv/archive/v0.36.0.tar.gz"
          out = pathlib.Path("/tmp/gmca-ps4-libmpv/libmpv-0.36.0.tar.gz")
          with urllib.request.urlopen(url, timeout=60) as src, out.open("wb") as dst:
              while True:
                  chunk = src.read(1024 * 1024)
                  if not chunk:
                      break
                  dst.write(chunk)
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          expected = "29abc44f8ebee013bb2f9fe14d80b30db19b534c679056e4851ceadf5a5e8bf6"
          if digest != expected:
              raise SystemExit(f"mpv source SHA256 mismatch: {digest}")
          print(f"mpv source SHA256: {digest}")
          PY

          cd "$work"
          tar -xzf libmpv-0.36.0.tar.gz
          cd mpv-0.36.0
          patch -Np1 -i ../mpv.patch
          patch -Np1 -i ../gmca-bitmap-subs.patch

          ./bootstrap.py
          source "$OPENORBIS/ps4vars.sh"
          TARGET=x86_64 ./waf configure --prefix="$OPENORBIS/usr" \
            --disable-libmpv-shared --enable-libmpv-static --disable-cplayer \
            --disable-iconv --disable-jpeg --disable-libavdevice \
            --enable-sdl2 --enable-sdl2-audio --disable-sdl2-gamepad --disable-sdl2-video
          ./waf build -j"$(nproc)"
          ./waf install

          test -s "$OPENORBIS/usr/lib/libmpv.a"
          strings "$OPENORBIS/usr/lib/libmpv.a" | grep -Fq "PS4 BGRA subtitle fallback: using alpha-mask LIBASS path."
          pkg-config --modversion mpv
          echo "GMCA patched PS4 libmpv installed and verified"

      - name: Build Stremio-only PS4 package
        env:
          OPENORBIS: /opt/pacbrew/ps4/openorbis
        run: |
          cmake -B build \
            -DPLATFORM_PS4=ON \
            -DGMCA_STREMIO_ONLY=ON \
            -DVERSION_BUILD=${{ github.run_number }}
          make -C build -j$(nproc)

      - name: Verify package and prepare update feed
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.ps4ver.outputs.version }}"
          pkg="build/${{ steps.ps4ver.outputs.pkg }}"
          stable_pkg="build/GMCA-PS4-Stremio-only.pkg"
          source_commit="$(git rev-parse HEAD)"

          test -f "$pkg"
          test -s "$pkg"
          test -s build/GMCA
          test -s build/ps4/resources/font/switch_font.ttf
          test -s build/ps4/updater.pkg
          helper_pkg="$(find build -type f -name '*GMCA00002*.pkg' -print -quit)"
          test -n "$helper_pkg"
          test -s "$helper_pkg"
          cp "$helper_pkg" build/GMCA-PS4-Updater.pkg

          main_elf_size="$(stat -c '%s' build/GMCA)"
          pkg_size="$(stat -c '%s' "$pkg")"
          read_be64() {
            local offset="$1"
            local file="$2"
            local hex
            hex="$(dd if="$file" bs=1 skip="$offset" count=8 status=none | od -An -tx1 | tr -d ' \n')"
            test "${#hex}" -eq 16
            echo "$((16#$hex))"
          }
          magic="$(dd if="$pkg" bs=1 count=4 status=none | od -An -tx1 | tr -d ' \n')"
          test "$magic" = "7f434e54"
          pfs_size="$(read_be64 $((0x418)) "$pkg")"
          header_pkg_size="$(read_be64 $((0x430)) "$pkg")"

          echo "PS4 payload sizes: ELF=$main_elf_size PFS=$pfs_size PKG=$pkg_size header-PKG=$header_pkg_size"
          if [ "$header_pkg_size" -ne "$pkg_size" ]; then
            echo "Invalid PS4 package: header package size does not match the actual file."
            exit 1
          fi
          if [ "$pkg_size" -le "$main_elf_size" ] || [ "$pfs_size" -le "$main_elf_size" ]; then
            echo "Invalid PS4 package: payload is not larger than the main GMCA ELF."
            echo "This usually means PacBrew's shared eboot.bin was overwritten by the updater SELF before add_pkg(GMCA)."
            exit 1
          fi

          stat -c '%n %s bytes' build/GMCA
          stat -c '%n %s bytes' build/ps4/updater.pkg
          stat -c '%n %s bytes' build/GMCA-PS4-Updater.pkg
          stat -c '%n %s bytes' build/ps4/resources/font/switch_font.ttf
          stat -c '%n %s bytes' "$pkg"

          (
            cd build
            sha256sum "${{ steps.ps4ver.outputs.pkg }}" GMCA-PS4-Updater.pkg | tee SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          cp "$pkg" "$stable_pkg"

          size="$pkg_size"
          sha="$(sha256sum "$pkg" | awk '{print $1}')"
          stable_sha="$(sha256sum "$stable_pkg" | awk '{print $1}')"
          test "$sha" = "$stable_sha"
          printf '%s  GMCA-PS4-Stremio-only.pkg\n' "$sha" > build/PS4-UPDATE-SHA256SUMS
          (cd build && sha256sum -c PS4-UPDATE-SHA256SUMS)

          printf '{\n' > build/ps4-update.json
          printf '  "schema": 1,\n' >> build/ps4-update.json
          printf '  "channel": "ps4-stremio-only",\n' >> build/ps4-update.json
          printf '  "title_id": "GMCA00000",\n' >> build/ps4-update.json
          printf '  "version": "%s",\n' "$version" >> build/ps4-update.json
          printf '  "pkg_name": "GMCA-PS4-Stremio-only.pkg",\n' >> build/ps4-update.json
          printf '  "size": %s,\n' "$size" >> build/ps4-update.json
          printf '  "sha256": "%s",\n' "$sha" >> build/ps4-update.json
          printf '  "commit": "%s",\n' "$source_commit" >> build/ps4-update.json
          printf '  "notes": "GMCA PS4 Stremio-only %s - commit %s"\n' "$version" "$source_commit" >> build/ps4-update.json
          printf '}\n' >> build/ps4-update.json

          grep -q "\"version\": \"$version\"" build/ps4-update.json
          grep -q "\"sha256\": \"$sha\"" build/ps4-update.json
          cat build/ps4-update.json

          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: GMCA-PS4-Stremio-only-${{ steps.ps4ver.outputs.version }}-${{ github.run_number }}
          path: |
            build/${{ steps.ps4ver.outputs.pkg }}
            build/GMCA-PS4-Stremio-only.pkg
            build/GMCA-PS4-Updater.pkg
            build/SHA256SUMS
            build/PS4-UPDATE-SHA256SUMS
            build/ps4-update.json
          if-no-files-found: error
